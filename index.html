<style>
:root {color-scheme:light;--ink:#3d3834;--muted:#8d8177;--paper:#fdfaf2;--linen:#e7e0d7;--wine:#654653;}
* {box-sizing:border-box} html,body {margin:0;min-height:100%} body {background:radial-gradient(ellipse at 50% 20%,#f5f0e9 0%,#e5ddd4 60%,#d8cec3 100%);font-family:'Gowun Batang','Noto Serif KR',Georgia,serif;color:var(--ink);overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;opacity:.25;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.5' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}
.wrap{min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:32px 16px 22px;gap:17px}
.eyebrow{color:#867669;font-family:Georgia,serif;letter-spacing:.26em;font-size:11px;text-transform:uppercase}
.stage{width:min(470px,94vw);height:min(660px,calc(100svh - 154px));min-height:400px;position:relative;perspective:1800px;filter:drop-shadow(9px 17px 14px #4b403344)}
.book{position:absolute;inset:0;border-radius:5px 12px 12px 5px;transform-style:preserve-3d;background:#eadccc;box-shadow:8px 8px 0 -3px #bcb09f,12px 11px 0 -4px #f7f0e4,15px 14px 0 -6px #c2b3a1}
.sheet{position:absolute;inset:0;border-radius:4px 11px 11px 4px;background:var(--paper);border:1px solid #e7ddcf;backface-visibility:hidden;overflow:hidden;display:flex;align-items:center;justify-content:center}
.sheet:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#c9bbac40 0%,transparent 8%,transparent 96%,#c5b8a726 100%);pointer-events:none}
.sheet:after{content:'';position:absolute;inset:13px;border:1px solid #d9cbbb54;border-radius:2px 7px 7px 2px;pointer-events:none}
.cover{color:#3f3733;background:linear-gradient(135deg,#fffdf6,#f5eddf 55%,#eee2d1);border:1px solid #d9c9b4;cursor:pointer;flex-direction:column;gap:28px;text-align:center;padding:35px 36px;box-shadow:inset 9px 0 17px #9f896d22}
.cover:before{background:linear-gradient(90deg,#bbac9940,transparent 10%,transparent 95%,#c4b19d33)}
.cover:after{inset:20px;border:1px solid #bda88988}
.cover .little{font-size:10px;letter-spacing:.23em;color:#967d6d;font-family:Georgia,serif}
/* 표지 장식: 검은 고양이와 생일 케이크 */
.cover .symbol{width:132px;height:124px;display:flex;align-items:center;justify-content:center;position:relative;margin:0 auto -3px}
.cover .symbol .cat-image{width:92px;height:92px;object-fit:contain;display:block;transform:translateY(19px)}
.cover .symbol .sparkle{position:absolute;color:#bca074;font-size:17px;left:-6px;top:26px}
.cover .birthday-icon{position:absolute;top:0;left:50%;right:auto;width:36px;height:36px;object-fit:contain;opacity:.95;transform:translateX(-50%);z-index:1}
.cover .mini-confetti{position:absolute;width:100%;height:100%;inset:0;pointer-events:none}
.cover .birthday-line{font-family:Georgia,serif;font-size:11px;letter-spacing:.22em;color:#f2d9ba}
.cover .small-heart{font-size:15px;color:#16141a;filter:drop-shadow(0 0 1px #f5d9c7)}
.cover h1{font-size:clamp(23px,5vw,32px);line-height:1.8;font-weight:400;letter-spacing:-.06em;margin:0;word-break:keep-all}
.cover .for{font-size:13px;letter-spacing:.15em;color:#8c7565}
.cover .tap{position:absolute;bottom:49px;font-size:11px;color:#e2c9bd;letter-spacing:.1em;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}
.letter{padding:48px clamp(26px,8%,55px) 58px;flex-direction:column;justify-content:center;align-items:stretch}
.section-title{text-align:center;font-size:12px;letter-spacing:.15em;color:#9b8b80;margin:0 0 36px;white-space:nowrap}
.text{font-size:clamp(14px,3.6vw,17px);line-height:2.25;letter-spacing:-.028em;word-break:keep-all;overflow-wrap:break-word;margin:0;max-height:100%;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#d8c9b7 transparent}
.footer{position:absolute;bottom:28px;left:0;right:0;text-align:center;color:#9a8d80;font-family:Georgia,serif;font-size:12px}
.final{flex-direction:column;gap:34px;text-align:center;padding:45px}.final .star{font-size:36px;color:#b09585}.final h2{font-size:21px;font-weight:400;line-height:1.9}.final p{font-size:13px;line-height:2.3;color:#857669}
.turn{animation:pageTurn .65s cubic-bezier(.2,.65,.2,1);transform-origin:left center;z-index:5;pointer-events:none;}
@keyframes pageTurn{0%{transform:rotateY(0);opacity:1}60%{opacity:.95}100%{transform:rotateY(-105deg);opacity:0}}
.turn-back{animation:backTurn .62s cubic-bezier(.2,.65,.2,1);transform-origin:left center;z-index:5;pointer-events:none}
@keyframes backTurn{0%{transform:rotateY(-90deg);opacity:0}100%{transform:rotateY(0);opacity:1}}
.controls{display:flex;justify-content:space-between;align-items:center;width:min(470px,94vw);gap:16px;min-height:38px}.nav{border:1px solid #bfb1a6;border-radius:100px;color:#67594e;background:#f9f4edb8;font:13px 'Gowun Batang',serif;padding:9px 17px;cursor:pointer;transition:.2s}.nav:hover:not(:disabled){background:#fff}.nav:disabled{opacity:.25;cursor:default}.counter{font:12px Georgia,serif;color:#82736a;letter-spacing:.16em;white-space:nowrap}.hint{font-size:11px;color:#94877d;text-align:center;line-height:1.5}
.audio-toggle{position:fixed;top:18px;right:18px;z-index:9999;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;width:44px;height:44px;display:grid;place-items:center;border:1px solid #c9b9a6;border-radius:50%;background:#fdfaf1e8;color:#594d43;box-shadow:0 3px 12px #4b40331c;cursor:pointer;line-height:1;transition:background .2s}.sound-icon{width:22px;height:22px;display:block}.audio-toggle:not(.is-playing) .sound-icon{opacity:.5}.audio-toggle:hover{background:#fff}.audio-toggle:focus-visible{outline:2px solid #7b665a;outline-offset:3px}
@media(max-width:480px){.wrap{padding-top:18px;padding-bottom:15px;gap:11px}.stage{height:calc(100svh - 148px);min-height:360px}.letter{padding:40px 28px 53px}.section-title{margin-bottom:24px;font-size:11px}.text{font-size:clamp(13.2px,3.7vw,15.5px);line-height:2.17}.footer{bottom:22px}.cover .tap{bottom:38px}}
@media(prefers-reduced-motion:reduce){.turn,.turn-back{animation:none}.cover .tap{animation:none}}

<script>
const pages = ["사람을 좋아하는 마음이 깊어지면 이상하게도 내가 알지 못하는 시간들이 궁금해진다. 지금의 그 사람을 만나기 전에는 어떤 모습으로 살아왔을까. 어린 시절에는 무엇을 좋아했고, 어떤 일에 울었으며, 누구의 손을 잡고 일어섰을까. 이미 오래전에 지나간 일인데도 그때의 작은 상처를 생각하면 괜히 마음이 쓰인다.", "내가 곁에 있었다면 아프지 않게 해주고 싶었을 것이고, 그럴 수 없다면 적어도 아픈 곳을 살펴주는 사람이고 싶었을 것이다. 좋아한다는 마음이 꼭 현재에만 머무르는 것은 아닌가 보다. 때로는 알지 못하는 과거에까지 닿아 그 시절의 행복을 바라게 된다.", "그렇다고 한 사람의 모든 시간을 알고 싶다는 뜻은 아니다. 오히려 마음이 깊어질수록 누군가를 잘 안다고 말하는 일이 조심스러워진다. 사람에게는 누구에게도 보여주지 않은 모습이 있고, 미처 설명하지 못한 사정이 있으며, 혼자서 정리해야 하는 마음도 있을 테니까. 내가 아는 모습이 전부라고 생각하지 않는 것.", "이해할 수 없는 일이 생겼을 때 내 기준으로 서둘러 판단하지 않는 것. 그 사람에게도 나름의 이유가 있을 거라고 생각하며 한 번 더 헤아려 보는 것. 어쩌면 누군가를 아끼는 일에는 그런 태도가 필요할지도 모른다.", "사랑은 생각보다 작은 일에서 모습을 드러내기도 한다. 밥을 잘 챙겨 먹었는지, 잠은 충분히 잤는지, 하루를 보내는 동안 속상한 일은 없었는지 궁금해지는 마음 같은 것. 혼자서도 잘할 수 있는 사람이라는 걸 알면서도 괜히 한 번 더 걱정하게 된다. 그 사람이 약해서가 아니라 소중하기 때문이다.", "아무리 단단한 사람이라도 가끔은 누군가의 보살핌이 필요하다는 걸 알기 때문이다. 잘 지내는 사람에게도 안부를 묻는 일이 필요한 이유는 아마 여기에 있을 것이다.", "누군가가 더 멀리 가기를 바라는 마음에는 잠시 멈추어도 괜찮다고 말해주는 일도 들어 있을 것이다. 조금 더 빨리 해내는 것만이 잘 살아가는 방법은 아니니까. 오래 걷기 위해서는 쉬는 법도 알아야 하고, 무엇을 이루기 위해 애쓰는 동안에도 자신의 마음을 돌볼 줄 알아야 한다. 내가 바라는 것은 하민이가 무엇이든 잘 해내는 날뿐 아니라, 아무것도 이루지 않은 날에도 편안히 잠들 수 있는 사람으로 살아가는 것이다.", "행복을 자꾸 다음으로 미루지 않았으면 한다. 더 잘하게 되면, 조금 더 나아지면, 어떤 목표에 닿으면 행복해지겠다는 생각 대신 지금 곁에 있는 작은 기쁨도 알아볼 수 있었으면 좋겠다. 크게 웃을 일이 없더라도 사소한 즐거움 하나쯤 간직한 하루라면, 그것만으로도 충분한 날이 있으니까.", "나는 하민이가 그런 다정함을 많이 누리며 살았으면 좋겠다. 특별히 힘든 일이 있어야만 위로받는 것이 아니라, 아무 일 없는 평범한 날에도 누군가의 관심과 배려를 받을 수 있었으면 좋겠다. 잘하고 있는지 묻기보다 오늘은 어땠는지 물어주는 사람, 어떤 모습을 보여주지 않아도 그 자체로 소중히 여겨주는 사람이 곁에 많았으면 한다.", "그가 다른 사람에게 얼마나 많은 것을 줄 수 있는지보다 스스로 얼마나 많은 사랑을 받으며 살아가는지가 더 중요하게 느껴진다.", "다정한 사람들을 생각하면 나도 그런 사람이 되고 싶어진다. 타인의 불편을 먼저 살피고, 작은 친절을 당연하게 여기지 않으며, 내 기준으로 누군가를 쉽게 판단하지 않는 사람. 사랑은 누군가를 아끼는 마음에서 그치지 않고 세상을 바라보는 태도까지 바꾸어 놓기도 한다.", "한 사람에게 받은 좋은 영향이 또 다른 사람에게 전해질 수 있다는 사실이 좋다. 내가 누군가에게 건네받은 다정함을 다른 사람에게도 나누어 줄 수 있다면, 그 마음은 내 안에서 끝나지 않고 조금 더 오래 남을 것이다.", "그러려면 내 마음속에 먼저 작은 여유가 있어야 할 것 같다. 사람마다 좋아하는 모습과 생각하는 방식은 다르고, 나와 비슷한 부분이 있다고 해서 그 사람을 내 모습에 맞추어 바라볼 이유는 없다. 닮은 점은 반갑게 여기되 다른 점을 굳이 고치려 하지 않는 것. 공감할 수 있는 만큼 가까워지고, 공감하기 어려운 부분 앞에서는 섣불리 벽을 세우지 않는 것. 그 정도의 느슨하고도 따뜻한 마음으로 사람을 대하고 싶다.", "누군가의 말에 언제든 귀 기울일 수 있는 사람이 되고 싶다. 어떤 이야기는 곧바로 이해할 수 없겠지만, 이해하지 못했다는 이유만으로 그 사람을 멀리 두지는 않는 사람. 마음을 여는 일에 너무 많은 조건을 붙이지 않고, 필요한 순간에는 손을 먼저 내밀 수 있는 사람. 그렇게 사람을 향한 자리를 조금 넓혀두는 것이 내가 배워가고 싶은 다정함이다.", "물론 마음만으로 모든 것을 이해할 수는 없다. 아무리 애정을 가지고 바라보더라도 내가 모르는 사정은 언제나 있을 것이고, 좋은 의도로 건넨 말이 뜻하지 않게 상처가 될 수도 있다. 그래서 더 신중해지고 싶다.", "내가 옳다고 믿는 것보다 상대가 어떻게 느낄지를 먼저 생각하고, 이해했다고 확신하기보다 아직 모르는 것이 있을 수 있음을 기억하는 사람이고 싶다. 다정함은 타고난 성격이기보다 누군가의 마음을 헤아리기 위해 오래 노력하는 태도에 가까운 것 같다.", "누군가의 탄생을 축하하는 일도 이제는 조금 다르게 느껴진다. 단순히 태어난 날짜를 기념하는 것이 아니라, 그 사람이 지나온 수많은 시간을 함께 소중히 여기는 일처럼 느껴진다. 내가 알지 못하는 어린 시절도, 지금의 모습을 이루기까지 쌓여온 날들도, 앞으로 맞이할 아직 오지 않은 날들도 모두 그 사람의 삶이니까.", "오늘은 하민이가 태어난 날이다. 그가 지나온 모든 시간을 알 수는 없지만 그 시간들이 모여 지금의 하민이 되었다는 사실이 고맙다. 그리고 앞으로 그가 살아갈 날들에는 받은 다정함을 오래 기억할 만큼 따뜻한 순간들이 많았으면 좋겠다.", "혼자 힘으로 일어설 수 있다는 이유로 늘 혼자 일어서야 하는 삶이 아니었으면 좋겠고, 아무렇지 않게 웃는 날에도 누군가는 그의 안녕을 궁금해했으면 좋겠다.", "한 사람을 좋아한다는 이유로 그 사람의 모든 행복을 책임질 수는 없다. 다만 그 행복을 진심으로 바랄 수는 있다. 내가 닿지 않는 곳에서도 충분히 사랑받고, 내가 알지 못하는 하루에도 좋은 사람들과 좋은 마음을 나누며 지내기를 바라는 것.", "그렇게 생각하면 사랑은 반드시 무언가를 해주어야만 하는 일이 아니라 한 사람의 세상이 조금 더 다정해지기를 바라는 일이기도 하다.", "그 사람이 태어난 날에 내가 바라는 것은 결국 그런 것들이다. 아픈 날보다 평온한 날이 많기를. 누군가에게 건넨 친절만큼 자신도 친절한 마음을 돌려받기를. 나이가 들어서도 여전히 보살핌을 받을 수 있기를. 그리고 무엇보다 자신이 얼마나 소중한 사람인지 잊지 않기를.", "더 높이 올라가야만 스스로를 인정할 수 있는 날들보다, 지금의 자신에게도 기꺼이 만족할 수 있는 날들이 많았으면 한다. 성실하게 살아온 만큼 자신을 아끼는 일에도 성실했으면 좋겠다. 때로는 욕심을 조금 내려놓고, 서툰 부분이 남아 있는 자신에게도 괜찮다고 말해줄 수 있었으면 좋겠다. 행복은 애써 도착해야 하는 먼 곳에만 있는 것이 아니라 오늘의 손안에도 조용히 놓여 있을 테니까.", "내가 한 사람의 세상을 전부 바꿀 수는 없겠지만, 그 사람으로 인해 내가 세상을 바라보는 방식은 조금 달라질 수 있다. 나를 조금 더 다정한 사람으로 만들고, 다른 사람의 마음을 한 번 더 생각하게 하며, 누군가의 평범한 하루를 진심으로 걱정하게 만드는 것.", "한 사람이 다른 사람에게 남기는 것은 생각보다 오래 이어진다. 내가 하민이를 좋아하며 배운 마음들이 누군가에게 건네는 작은 친절로 남는다면, 그 사실만으로도 이 마음에는 충분한 의미가 있을 것이다.", "오늘 하민이의 생일을 진심으로 축하한다. 무언가를 더 잘해야만 행복해지는 것이 아니라, 지금의 자신으로도 마음 놓고 웃을 수 있는 날이 오래도록 이어지기를 바란다. 생일 축하해, 하민아. 존재해 줘서 고마워."];
// 검은 고양이와 작은 생일 케이크 모티프
const coverArtwork = `<img class="cat-image" src="cat.png" alt="" /><img class="birthday-icon" src="birthday-icon.png" alt="" /><span class="sparkle">✦</span>`;
const page=document.getElementById('page'),book=document.getElementById('book'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');
let index=0,locked=false;
const total=pages.length+2;
function render(el,i){el.className='sheet';el.innerHTML='';if(i===0){el.classList.add('cover');el.innerHTML='<span class="little">HAPPY BIRTHDAY, HAMIN</span><span class="symbol" aria-hidden="true">'+coverArtwork+'</span><h1>한 사람의<br>안뇽을 바라는 일</h1><span class="for">하민이에게</span>';el.onclick=()=>go(1);}
else if(i===total-1){el.classList.add('final');el.innerHTML='<div class="star" aria-hidden="true">✦</div><h2>생일 축하해, 하민아.</h2><p>오늘도, 앞으로도<br>마음 놓고 행복하기를.</p><span class="footer">TO BE CONTINUED…</span>';el.onclick=null;}
else{el.classList.add('letter');let title=document.createElement('div');title.className='section-title';title.textContent='한 사람의 안녕을 바라는 일';let p=document.createElement('p');p.className='text';p.textContent=pages[i-1];let f=document.createElement('span');f.className='footer';f.textContent=String(i).padStart(2,'0');el.append(title,p,f);el.onclick=null;}}
function update(){prev.disabled=index===0;next.disabled=index===total-1;count.textContent=index===0?'':index===total-1?'TO BE CONTINUED…':String(index).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');}
function go(delta){if(locked)return;const dest=index+delta;if(dest<0||dest>=total)return;locked=true;const ghost=page.cloneNode(true);ghost.removeAttribute('id');ghost.removeAttribute('tabindex');ghost.removeAttribute('aria-live');ghost.onclick=null;ghost.classList.add(delta>0?'turn':'turn-back');book.append(ghost);index=dest;render(page,index);update();setTimeout(()=>{ghost.remove();locked=false},670);}
prev.addEventListener('click',()=>go(-1));next.addEventListener('click',()=>go(1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){go(1)}if(e.key==='ArrowLeft'){go(-1)}});
let startX=0,startY=0;book.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;startY=e.changedTouches[0].screenY},{passive:true});book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX,dy=e.changedTouches[0].screenY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)go(dx<0?1:-1)},{passive:true});
// 오디오는 클릭/터치 등 명시적인 사용자 동작에서만 재생한다.
const bgm=document.getElementById('bgm');
const audioToggle=document.getElementById('audioToggle');
let musicWanted=true;
bgm.volume=0.45;
function syncAudioButton(){
 const playing=!bgm.paused && !bgm.muted;
 audioToggle.classList.toggle('is-playing',playing);
 audioToggle.querySelector('.sound-icon').src=playing?'sound-icon.png':'no-audio-icon.png';
 audioToggle.setAttribute('aria-label',playing?'배경음악 끄기':'배경음악 켜기');
 audioToggle.setAttribute('title',playing?'배경음악 끄기':'배경음악 켜기');
 audioToggle.setAttribute('aria-pressed',String(playing));
}
function startMusic(){
 bgm.muted=false;
 musicWanted=true;
 // Promise를 기다리지 않고 바로 UI를 갱신한다. 파일 오류 시 브라우저 콘솔에도 남긴다.
 const result=bgm.play();
 if(result&&typeof result.catch==='function')result.catch(err=>{
   console.warn('BGM 재생 실패: bgm.mp3 파일 경로/형식 확인 필요',err);
   syncAudioButton();
 });
 syncAudioButton();
}
function toggleMusic(event){
 event.preventDefault();
 event.stopPropagation();
 if(!bgm.paused&&!bgm.muted){
   musicWanted=false;
   bgm.pause();
 }else{
   startMusic();
 }
 syncAudioButton();
}
audioToggle.addEventListener('click',toggleMusic);
// 표지 또는 다음 버튼을 눌러 첫 페이지를 열 때 자동 재생 시도.
const originalGo=go;
go=function(delta){
 const wasCover=index===0;
 originalGo(delta);
 if(wasCover&&index!==0&&musicWanted&&bgm.paused)startMusic();
};
bgm.addEventListener('play',syncAudioButton);
bgm.addEventListener('pause',syncAudioButton);
bgm.addEventListener('error',()=>{
 console.warn('bgm.mp3를 불러오지 못했습니다. index.html과 같은 폴더에 있는지 확인하세요.');
 syncAudioButton();
});
render(page,index);update();syncAudioButton();
</script>
</body>
</html>
